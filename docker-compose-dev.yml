# ClientRoll Development Docker Compose
# Includes PostgreSQL and Redis for local development

services:
  postgres:
    image: postgres:16-alpine
    container_name: clientroll-postgres-dev
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: clientroll_db
      POSTGRES_USER: clientroll_user
      POSTGRES_PASSWORD: clientroll_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clientroll-redis-dev
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes

volumes:
  pgdata:
